<div class="filter-section">
  <h3 class="filter-title clickable" (click)="toggleCollapse()">
    Filters <span class="collapse-icon">{{ isCollapsed ? '▶' : '▼' }}</span>
  </h3>
  <div class="filter-content" [class.collapsed]="isCollapsed">
    <app-search-bar (pointerdown)="closeDropdowns()" (focusin)="closeDropdowns()" (searchChange)="onSearchChange($event)"></app-search-bar>
    <div class="filter-chips">
      @if (!isMobileDevice()) {
        <button class="filter-chip chat-filter-chip" [class.active]="filters.activeChats" [disabled]="searchTerm.trim().length > 0" (click)="toggleFilter('activeChats')">💬 Active ({{ activeChatCount }})</button>
        <button class="filter-chip chat-filter-chip" [class.active]="filters.activeNoChats" [disabled]="searchTerm.trim().length > 0" (click)="toggleFilter('activeNoChats')">😐 No Chats</button>
      }

      <div class="filter-dropdown" [class.disabled]="searchTerm.trim().length > 0"
        [class.open]="isDropdownOpen('status')" (pointerenter)="enterMenu('status', $event)" (pointerleave)="leaveMenu('status')">
        <button type="button" class="dropdown-toggle" [attr.aria-expanded]="isDropdownOpen('status')" (click)="toggleDropdown('status')">Status</button>
        <div class="dropdown-panel">
          <button type="button" class="dropdown-action" (click)="toggleAllStatuses()">{{ allStatusesSelected ? 'Active Only' : 'Select All' }}</button>
          <label><input type="checkbox" [checked]="filters.active" [disabled]="isLastStatus('active')" (change)="toggleFilter('active')" /> ✓ Active (All)</label>
          <label><input type="checkbox" [checked]="filters.inactive" [disabled]="isLastStatus('inactive')" (change)="toggleFilter('inactive')" /> ⏸ Inactive</label>
          <label><input type="checkbox" [checked]="filters.retired" [disabled]="isLastStatus('retired')" (change)="toggleFilter('retired')" /> 🌇 Retired</label>
          <label><input type="checkbox" [checked]="filters.superRetired" [disabled]="isLastStatus('superRetired')" (change)="toggleFilter('superRetired')" /> 🌑 Super Retired</label>
          <label><input type="checkbox" [checked]="filters.side" [disabled]="isLastStatus('side')" (change)="toggleFilter('side')" /> 👥 Side</label>
        </div>
      </div>

      @if (!showingOnlySide) {
        <div class="filter-dropdown" [class.disabled]="searchTerm.trim().length > 0"
          [class.open]="isDropdownOpen('purpose')" (pointerenter)="enterMenu('purpose', $event)" (pointerleave)="leaveMenu('purpose')">
          <button type="button" class="dropdown-toggle" [attr.aria-expanded]="isDropdownOpen('purpose')" (click)="toggleDropdown('purpose')">Purpose</button>
          <div class="dropdown-panel">
            <label title="Unchecked includes both RP-friendly and non-RP-friendly characters">
              <input type="checkbox" [checked]="filters.rpFriendlyOnly" (change)="toggleOnly('rpFriendlyOnly')" /> ⚔️ RP
            </label>
            <label title="Unchecked includes both knowledge-friendly and non-knowledge-friendly characters">
              <input type="checkbox" [checked]="filters.knowledgeFriendlyOnly" (change)="toggleOnly('knowledgeFriendlyOnly')" /> 🧠 Knowledge
            </label>
            <p class="filter-help">Unchecked options include both types.</p>
          </div>
        </div>
      }

      <div class="filter-dropdown" [class.disabled]="searchTerm.trim().length > 0"
        [class.open]="isDropdownOpen('gender')" (pointerenter)="enterMenu('gender', $event)" (pointerleave)="leaveMenu('gender')">
        <button type="button" class="dropdown-toggle" [attr.aria-expanded]="isDropdownOpen('gender')" (click)="toggleDropdown('gender')">Gender</button>
        <div class="dropdown-panel">
          <label><input type="checkbox" [checked]="filters.moeFemale !== false" [disabled]="isLastGender('moeFemale')" (change)="toggleGender('moeFemale')" /> @if (!isIOS) { 🩷 } Female (Moe 8+)</label>
          <label><input type="checkbox" [checked]="filters.nonMoeFemale !== false" [disabled]="isLastGender('nonMoeFemale')" (change)="toggleGender('nonMoeFemale')" /> @if (!isIOS) { ♀️ } Female (Moe 1-7)</label>
          <label><input type="checkbox" [checked]="filters.male !== false" [disabled]="isLastGender('male')" (change)="toggleGender('male')" /> @if (!isIOS) { ♂️ } Male/Other</label>
        </div>
      </div>

      <div class="filter-dropdown"
        [class.open]="isDropdownOpen('sort')" (pointerenter)="enterMenu('sort', $event)" (pointerleave)="leaveMenu('sort')">
        <button type="button" class="dropdown-toggle" [attr.aria-expanded]="isDropdownOpen('sort')" (click)="toggleDropdown('sort')">Sort</button>
        <div class="dropdown-panel">
          <button type="button" class="dropdown-action" (click)="sortChange.emit('none')">Clear Sort</button>
          @for (option of sortOptions; track option.value) {
            <label><input type="radio" name="roster-sort" [value]="option.value" [checked]="sortBy === option.value" (change)="sortChange.emit(option.value)" /> {{ option.label }}</label>
          }
          <p class="filter-help">Tier is the default sort.</p>
        </div>
      </div>
    </div>
  </div>
</div>
