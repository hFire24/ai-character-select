<section class="date-range" aria-label="Chart date range">
  <strong>Date range</strong>
  <div class="date-range-presets" aria-label="Date range mode">
    <button type="button" [class.active]="chart.zoomLevel === 'full'" [attr.aria-pressed]="chart.zoomLevel === 'full'" (click)="reset()">Full Range</button>
    <button type="button" [class.active]="hasSlidingZoom" [attr.aria-pressed]="hasSlidingZoom" (click)="setDurationMode()">Start + Duration</button>
    <button type="button" [class.active]="chart.zoomLevel === 'custom'" [attr.aria-pressed]="chart.zoomLevel === 'custom'" (click)="setCustom()">Start + End</button>
  </div>
  @if (hasSlidingZoom) {
    <div class="date-range-presets" aria-label="Duration in days">
      <label><span>Duration (days)</span><input type="number" min="1" [max]="totalDays + 1"
        [ngModel]="slidingZoomDays" (ngModelChange)="updateDuration($event)" /></label>
      <label><span>Duration preset</span>
        <select [ngModel]="durationPreset" (ngModelChange)="$event !== '' && setRecentDays($event)">
          <option [ngValue]="''" disabled>Custom</option>
          @for (days of durationPresets; track days) {
            <option [ngValue]="days">{{ days }} days</option>
          }
        </select>
      </label>
    </div>
    <div class="zoom-window">
      <label class="zoom-slider">
        <span>Move date window</span>
        <input type="range" min="0" [max]="sliderMaximum" step="1" [value]="sliderValue"
          aria-label="Start date; use arrow keys to move one day or Shift plus arrow keys to move by the zoom level"
          (input)="updateSlider($any($event.target).value)" />
        <small>{{ formatDate(selectedStart) }} &ndash; {{ formatDate(selectedEnd) }}</small>
      </label>
      <div class="zoom-navigation">
        <button type="button" class="zoom-step" [disabled]="!canMoveBackward"
          [attr.aria-label]="'View the previous ' + slidingZoomDays + ' days'" (click)="moveWindow(-1)">&larr; {{ slidingZoomDays }} days</button>
        <label class="zoom-start-date"><span>Start date</span><input type="date" [ngModel]="chart.selectedStartDate"
          [min]="chart.datasetStartDate" [max]="latestStartDate" (ngModelChange)="updateStartDate($event)" /></label>
        <button type="button" class="zoom-step" [disabled]="!canMoveForward"
          [attr.aria-label]="'View the next ' + slidingZoomDays + ' days'" (click)="moveWindow(1)">{{ slidingZoomDays }} days &rarr;</button>
      </div>
      <small class="zoom-help">Arrow keys move one day. Shift + Left/Right moves {{ slidingZoomDays }} days.</small>
    </div>
  } @else if (chart.zoomLevel === 'custom') {
    <div class="dual-range" [style.--range-start.%]="rangeStartPercent" [style.--range-end.%]="rangeEndPercent">
      <input class="range-thumb-a" type="range" min="0" [max]="totalDays" step="1" [value]="firstHandleValue"
        [disabled]="totalDays === 0" aria-label="First date handle" [attr.aria-valuetext]="firstHandleDate"
        (input)="updateRangeSlider($any($event.target).value, 'first')" />
      <input class="range-thumb-b" type="range" min="0" [max]="totalDays" step="1" [value]="secondHandleValue"
        [disabled]="totalDays === 0" aria-label="Second date handle" [attr.aria-valuetext]="secondHandleDate"
        (input)="updateRangeSlider($any($event.target).value, 'second')" />
    </div>
    <div class="date-range-fields">
      <label><span>From</span><input type="date" [ngModel]="chart.selectedStartDate" [min]="chart.datasetStartDate"
        [max]="chart.selectedEndDate" (ngModelChange)="updateCustomStart($event)" /></label>
      <label><span>To</span><input type="date" [ngModel]="chart.selectedEndDate" [min]="chart.selectedStartDate"
        [max]="chart.datasetEndDate" (ngModelChange)="updateCustomEnd($event)" /></label>
    </div>
  }
</section>
