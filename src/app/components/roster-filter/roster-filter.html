<div class="filter-section">
  <h3 class="filter-title clickable" (click)="toggleCollapse()">
    Filters <span class="collapse-icon">{{ isCollapsed ? '▶' : '▼' }}</span>
  </h3>
  <div class="filter-content" [class.collapsed]="isCollapsed">
    <app-search-bar (searchChange)="onSearchChange($event)"></app-search-bar>
    <div class="filter-chips">
      @if (!isMobileDevice()) {
        <button class="filter-chip chat-filter-chip" [class.active]="filters.activeChats" [disabled]="searchTerm.trim().length > 0" (click)="toggleFilter('activeChats')">💬 Active (Chats)</button>
        <button class="filter-chip chat-filter-chip" [class.active]="filters.activeNoChats" [disabled]="searchTerm.trim().length > 0" (click)="toggleFilter('activeNoChats')">😐 No Chats</button>
      }

      <details class="filter-dropdown" [class.disabled]="searchTerm.trim().length > 0"
        [open]="activeDropdown === 'status'" (mouseenter)="hoverDropdown('status')" (mouseleave)="hideDropdown('status')">
        <summary (click)="$event.preventDefault(); toggleDropdown('status')">Status</summary>
        <div class="dropdown-panel">
          <label><input type="checkbox" [checked]="filters.active" [disabled]="isLastStatus('active')" (change)="toggleFilter('active')" /> ✓ Active (All)</label>
          <label><input type="checkbox" [checked]="filters.inactive" [disabled]="isLastStatus('inactive')" (change)="toggleFilter('inactive')" /> ⏸ Inactive</label>
          <label><input type="checkbox" [checked]="filters.retired" [disabled]="isLastStatus('retired')" (change)="toggleFilter('retired')" /> 🌇 Retired</label>
          <label><input type="checkbox" [checked]="filters.superRetired" [disabled]="isLastStatus('superRetired')" (change)="toggleFilter('superRetired')" /> 🌑 Super Retired</label>
          <label><input type="checkbox" [checked]="filters.side" [disabled]="isLastStatus('side')" (change)="toggleFilter('side')" /> 👥 Side</label>
        </div>
      </details>

      @if (!showingOnlySide) {
        <details class="filter-dropdown" [class.disabled]="searchTerm.trim().length > 0"
          [open]="activeDropdown === 'purpose'" (mouseenter)="hoverDropdown('purpose')" (mouseleave)="hideDropdown('purpose')">
          <summary (click)="$event.preventDefault(); toggleDropdown('purpose')">Purpose</summary>
          <div class="dropdown-panel">
            <label title="Unchecked includes both RP-friendly and non-RP-friendly characters">
              <input type="checkbox" [checked]="filters.rpFriendlyOnly" (change)="toggleOnly('rpFriendlyOnly')" /> ⚔️ RP
            </label>
            <label title="Unchecked includes both knowledge-friendly and non-knowledge-friendly characters">
              <input type="checkbox" [checked]="filters.knowledgeFriendlyOnly" (change)="toggleOnly('knowledgeFriendlyOnly')" /> 🧠 Knowledge
            </label>
            <p class="filter-help">Unchecked options include both types.</p>
          </div>
        </details>
      }

      <details class="filter-dropdown" [class.disabled]="searchTerm.trim().length > 0"
        [open]="activeDropdown === 'gender'" (mouseenter)="hoverDropdown('gender')" (mouseleave)="hideDropdown('gender')">
        <summary (click)="$event.preventDefault(); toggleDropdown('gender')">Gender</summary>
        <div class="dropdown-panel">
          <label><input type="checkbox" [checked]="filters.moeFemale !== false" [disabled]="isLastGender('moeFemale')" (change)="toggleGender('moeFemale')" /> <span class="gender-emoji">🩷</span> Female (Moe 8+)</label>
          <label><input type="checkbox" [checked]="filters.nonMoeFemale !== false" [disabled]="isLastGender('nonMoeFemale')" (change)="toggleGender('nonMoeFemale')" /> <span class="gender-emoji">♀️</span> Female (Moe 1-7)</label>
          <label><input type="checkbox" [checked]="filters.male !== false" [disabled]="isLastGender('male')" (change)="toggleGender('male')" /> <span class="gender-emoji">♂️</span> Male/Other</label>
        </div>
      </details>
    </div>
  </div>
</div>
